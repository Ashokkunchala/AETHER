name: Apply reviewed Android launcher changes
on:
  push:
    branches: [chore/apply-launcher]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply locally tested changes
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "19359357f10f7b93a238fdcabd32b133de8838bc"
          git config user.name 'Ashok Kunchala'
          git config user.email 'Ashokkunchala@users.noreply.github.com'
          git checkout -b feature/production-android-launcher
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/change.patch
          git am /tmp/change.patch
          git push origin feature/production-android-launcher
