name: Apply reviewed Android launcher changes
on:
  push:
    branches: [chore/apply-launcher]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply locally tested changes
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "19359357f10f7b93a238fdcabd32b133de8838bc"
          git config user.name 'Ashok Kunchala'
          git config user.email 'Ashokkunchala@users.noreply.github.com'
          git checkout -b feature/production-android-launcher
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/change.patch
          git am /tmp/change.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify and publish Android test download
        run: |
          set -euo pipefail
          bash android/gradlew -p android testDebugUnitTest lintDebug assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/AETHER-Android.apk
          sha256sum downloads/AETHER-Android.apk > downloads/ANDROID-SHA256.txt
          git add downloads/AETHER-Android.apk downloads/ANDROID-SHA256.txt
          git commit -m 'Publish verified Android 0.3.0 test launcher'
          git push origin feature/production-android-launcher
