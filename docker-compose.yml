services:
  aether:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aether
    env_file:
      - .env
    ports:
      # Loopback only: do not expose this prototype directly to a LAN or internet.
      - "127.0.0.1:8000:8000"
    volumes:
      - aether-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  aether-data:
